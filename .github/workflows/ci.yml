name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Validate and test rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --quiet "semgrep==1.181.0" pyyaml pytest

      - name: Lint rule metadata
        run: python3 scripts/check_metadata.py rules

      - name: Validate rule syntax
        run: semgrep --validate --config rules --metrics=off --disable-version-check

      - name: Run fixture tests
        run: semgrep --test --config rules tests --metrics=off --disable-version-check

      - name: Audit fixtures for unannotated findings
        run: python3 scripts/check_fixtures.py

      - name: Check that the single-file bundle is current
        run: python3 scripts/bundle.py --check

      - name: Audit fixtures against the bundle
        run: python3 scripts/check_fixtures.py --config agentic-semgrep-rules.yaml

      - name: Script tests (fuzz, scaling)
        run: python3 -m pytest -q scripts/tests

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the test runner
        run: python -m pip install --quiet pytest pyyaml

      - name: Install Semgrep in a fresh venv and run the README quick start and Example
        env:
          SEMGREP_E2E: "1"
          SEMGREP_VERSION: "1.181.0"
        run: python3 -m pytest -q scripts/tests/test_quickstart_e2e.py

  action:
    name: Smoke test the composite action
    runs-on: ubuntu-latest
    needs: rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the action against the fixtures (expect findings, no upload)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: tests
          severity: ERROR
          upload-sarif: "false"

      - name: Check that the action produced a SARIF report and findings
        run: |
          test -s results.sarif
          test "${{ steps.scan.outputs.finding-count }}" != "0"
          test "${{ steps.scan.outcome }}" = "failure"
