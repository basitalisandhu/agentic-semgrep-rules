name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Validate and test rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --quiet "semgrep==1.179.0" pyyaml

      - name: Lint rule metadata
        run: python3 scripts/check_metadata.py rules

      - name: Validate rule syntax
        run: semgrep --validate --config rules --metrics=off --disable-version-check

      - name: Run fixture tests
        run: semgrep --test --config rules tests --metrics=off --disable-version-check

      - name: Audit fixtures for unannotated findings
        run: python3 scripts/check_fixtures.py

      - name: Check that the single-file bundle is current
        run: python3 scripts/bundle.py --check

      - name: Audit fixtures against the bundle
        run: python3 scripts/check_fixtures.py --config agentic-semgrep-rules.yaml

  action:
    name: Smoke test the composite action
    runs-on: ubuntu-latest
    needs: rules
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against the fixtures (expect findings, no upload)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: tests
          severity: ERROR
          upload-sarif: "false"

      - name: Check that the action produced a SARIF report and findings
        run: |
          test -s results.sarif
          test "${{ steps.scan.outputs.finding-count }}" != "0"
          test "${{ steps.scan.outcome }}" = "failure"
