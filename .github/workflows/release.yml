name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --quiet "semgrep==1.179.0" pyyaml

      - name: Validate and test before releasing
        run: |
          python3 scripts/check_metadata.py rules
          semgrep --validate --config rules --metrics=off --disable-version-check
          semgrep --test --config rules tests --metrics=off --disable-version-check
          python3 scripts/check_fixtures.py
          python3 scripts/bundle.py --check

      - name: Bundle the rule pack
        run: |
          mkdir -p dist
          tar -czf "dist/agentic-semgrep-rules-${GITHUB_REF_NAME}.tar.gz" rules README.md LICENSE CHANGELOG.md
          python3 scripts/bundle.py --out dist/agentic-semgrep-rules.yaml

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          python3 - <<'PY' > release-notes.md
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"Release {tag}")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/agentic-semgrep-rules-${{ github.ref_name }}.tar.gz
            dist/agentic-semgrep-rules.yaml

      - name: Move the major version tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
