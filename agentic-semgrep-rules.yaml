- id: python.permissions.langchain-allow-dangerous-code
  languages:
  - python
  severity: WARNING
  message: '''allow_dangerous_code=True'' opts into LangChain components (pandas, CSV, Spark or Python
    agents) that execute model-generated Python in this process. Any prompt injection reaching the agent
    becomes arbitrary code execution with the process''s credentials. Remove the flag and use a structured
    tool for the analysis you need, or run the agent inside a disposable sandbox (separate container,
    no secrets, no network, resource limits) and treat its output as untrusted.'
