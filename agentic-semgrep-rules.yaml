- id: javascript.mcp.mcp-http-transport-without-auth
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: An MCP HTTP transport ('$TRANSPORT') is created inside a route handler that has no authentication
    middleware, and none is registered with app.use() before it. Anyone who can reach the port can list
    and call every tool this server exposes, and SSE and streamable-HTTP endpoints are also reachable
    from browsers via DNS rebinding. Protect the route with the SDK's requireBearerAuth middleware (or
    your own token or session check), enable enableDnsRebindingProtection with allowedHosts, bind to localhost
    unless remote access is intended, and put TLS in front. Use the stdio transport for local, single-user
