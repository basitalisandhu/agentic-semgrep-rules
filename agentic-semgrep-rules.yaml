  - pattern: ollama.generate(...)
    exact: true
  - pattern: $MODEL.generateContent(...)
    exact: true
  - pattern: $CLIENT.models.generateContent(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern: $X.invoke(...)
      - pattern: $X.run(...)
      - pattern: $X.predict(...)
