  - pattern: ollama.generate(...)
    exact: true
  - pattern: $MODEL.generateContent(...)
    exact: true
  - pattern: $CLIENT.models.generateContent(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern: $X.invoke(...)
      - pattern: $X.run(...)
      - pattern: $X.predict(...)
      - pattern: $X.stream(...)
      - pattern: $X.batch(...)
    - metavariable-regex:
        metavariable: $X
        regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
    exact: true
  - pattern: $R.choices[0].message.content
  - pattern: $R.choices[0].text
  - pattern: $R.output_text
  - pattern: $R.content[0].text
  - pattern: $R.response.text()
  pattern-sanitizers:
  - pattern: DOMPurify.sanitize(...)
  - pattern: sanitizeHtml(...)
  - pattern: sanitize(...)
  - pattern: escapeHtml(...)
  - pattern: escape(...)
  - pattern: xss(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $EL.innerHTML = $HTML
      - pattern: $EL.outerHTML = $HTML
      - pattern: $EL.innerHTML += $HTML
      - pattern: $EL.insertAdjacentHTML($POS, $HTML)
      - pattern: document.write($HTML)
      - pattern: document.writeln($HTML)
      - pattern: '{ __html: $HTML }'
      - pattern: $EL.html($HTML)
      - pattern: $($HTML)
      - pattern: jQuery($HTML)
