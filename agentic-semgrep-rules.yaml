- id: javascript.injection.llm-output-to-innerhtml
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Text returned by a language model is inserted into the DOM as HTML by '$SINK'. Models can be
    made to emit script tags, event handlers or markdown with embedded HTML, which turns a prompt injection
    into cross-site scripting against whoever views the answer (session theft, actions in the user's browser).
    Render model output as text (textContent, React children), or convert markdown with HTML disabled
    and sanitise the result with DOMPurify before inserting it.
  mode: taint
  pattern-sources:
  - pattern: $CLIENT.chat.completions.create(...)
    exact: true
  - pattern: $CLIENT.responses.create(...)
    exact: true
  - pattern: $CLIENT.messages.create(...)
    exact: true
