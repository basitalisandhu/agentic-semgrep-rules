- id: python.secrets.api-key-in-command-line-arg
  languages:
  - python
  severity: WARNING
  message: An API key or token is accepted or passed as a command-line argument. Command lines are visible
    to every user on the host (ps, /proc), end up in shell history, process monitors, crash reports and
    CI logs. Read the secret from an environment variable, a file with restricted permissions, or a secrets
    manager instead, and if a child process needs it pass it through its environment.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: $PARSER.add_argument("$FLAG", ...)
        - pattern: $PARSER.add_argument("$SHORT", "$FLAG", ...)
        - pattern: click.option("$FLAG", ...)
        - pattern: typer.Option(..., "$FLAG", ...)
      - metavariable-regex:
          metavariable: $FLAG
          regex: ^--?(([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)|(openai|anthropic|hf|huggingface|groq|mistral|cohere|google|gemini|azure|aws|replicate|together)[-_]?(key|secret)|key|secret)$
    - patterns:
      - pattern: subprocess.$FUNC([..., "$FLAG", $VALUE, ...], ...)
      - metavariable-regex:
          metavariable: $FLAG
          regex: ^--?(([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)|(openai|anthropic|hf|huggingface|groq|mistral|cohere|google|gemini|azure|aws|replicate|together)[-_]?(key|secret)|key|secret)$
    - patterns:
      - pattern: subprocess.$FUNC([..., $ARG, ...], ...)
      - metavariable-regex:
          metavariable: $ARG
          regex: ^(f["']|["'].*\+\s*)?--?([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)=.*$
    - patterns:
      - pattern-either:
        - pattern: subprocess.$FUNC([..., os.environ["$ENV"], ...], ...)
        - pattern: subprocess.$FUNC([..., os.getenv("$ENV", ...), ...], ...)
        - pattern: subprocess.$FUNC([..., os.environ.get("$ENV", ...), ...], ...)
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i)^.*(api[_-]?key|secret|token|password).*$
  metadata:
    category: security
    subcategory:
    - audit
    cwe:
    - 'CWE-214: Invocation of Process Using Visible Sensitive Information'
    owasp:
    - LLM02:2025 Sensitive Information Disclosure
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - python
    - argparse
    - click
    - typer
    - subprocess
    - secrets
    - llm
    references:
    - https://cwe.mitre.org/data/definitions/214.html
    - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    - https://docs.python.org/3/library/subprocess.html#security-considerations
    masoon:
      pack: agentic-semgrep-rules
      family: secrets
- id: python.secrets.hardcoded-llm-api-key
  languages:
  - python
  severity: ERROR
  message: A model-provider API key is hard-coded in source. Anyone with read access to this file or its
    history (a fork, a container image, a CI log, a leaked backup) can spend against your account, exfiltrate
    data through your provider, and impersonate your agent. Revoke this key now, then load keys from an
    environment variable or a secrets manager at runtime and add a secret scanner (gitleaks, trufflehog
    or GitHub secret scanning) to CI.
  pattern-either:
  - pattern-regex: (?<![A-Za-z0-9_\-])sk-(proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{32,}(?![A-Za-z0-9_\-])
  - pattern-regex: (?<![A-Za-z0-9_\-])sk-ant-(api|admin)[0-9]{2}-[A-Za-z0-9_\-]{32,}(?![A-Za-z0-9_\-])
  - pattern-regex: (?<![A-Za-z0-9_])hf_[A-Za-z0-9]{30,}(?![A-Za-z0-9_])
  - pattern-regex: (?<![A-Za-z0-9_\-])(gsk_[A-Za-z0-9]{40,}|r8_[A-Za-z0-9]{36,}|pplx-[A-Za-z0-9]{40,}|xai-[A-Za-z0-9_\-]{40,})(?![A-Za-z0-9_\-])
  - pattern-regex: (?<![A-Za-z0-9_\-])AIza[0-9A-Za-z_\-]{35}(?![A-Za-z0-9_\-])
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - LLM02:2025 Sensitive Information Disclosure
    confidence: HIGH
    likelihood: HIGH
    impact: HIGH
    technology:
    - python
    - openai
    - anthropic
    - huggingface
    - groq
    - replicate
    - secrets
    - llm
    references:
    - https://cwe.mitre.org/data/definitions/798.html
    - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    - https://huggingface.co/docs/hub/security-tokens
    - https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
    masoon:
      pack: agentic-semgrep-rules
      family: secrets
- id: python.secrets.llm-api-key-logged
  languages:
  - python
  severity: WARNING
  message: A secret read from the environment (an API key, token or password, or the whole environment
    after load_dotenv) is written to stdout or a log. Logs are copied to CI output, log aggregators, crash
    reports and support tickets, so this is a credential leak. Never print secrets; log only whether a
    key is set, or a masked suffix, and keep the process environment out of debug dumps.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: os.environ[$KEY]
      - pattern: os.environ.get($KEY, ...)
      - pattern: os.getenv($KEY, ...)
      - pattern: dotenv_values(...)[$KEY]
      - pattern: config($KEY, ...)
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i)^.*(api[_-]?key|secret|token|password|credential).*$
  - patterns:
    - pattern-either:
      - pattern-inside: $FUNC(..., os.environ, ...)
      - pattern-inside: $OBJ.$FUNC(..., os.environ, ...)
    - pattern: os.environ
  - pattern: dotenv_values(...)
    exact: true
  pattern-sanitizers:
  - pattern: bool(...)
  - pattern: len(...)
  - pattern: $X is None
  - pattern: $X is not None
  - pattern: mask(...)
  - pattern: redact(...)
  - pattern: $X[-4:]
  - pattern: $X[:4]
  - pattern: $X[-6:]
  pattern-sinks:
  - pattern: print(...)
  - pattern: pprint(...)
  - patterns:
    - pattern: $LOGGER.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(debug|info|warning|warn|error|critical|exception|log|success|trace)$
    - metavariable-regex:
        metavariable: $LOGGER
        regex: ^(logging|logger|log|LOGGER|LOG|_logger|_log|self\.logger|self\.log|loguru\.logger|structlog|console|rich\.print)$
  - pattern: sys.stdout.write(...)
  - pattern: sys.stderr.write(...)
  - pattern: console.print(...)
  - pattern: rich.print(...)
  - pattern: st.write(...)
  - pattern: st.text(...)
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-532: Insertion of Sensitive Information into Log File'
    owasp:
    - LLM02:2025 Sensitive Information Disclosure
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    technology:
    - python
    - dotenv
    - logging
    - secrets
    - llm
    references:
    - https://cwe.mitre.org/data/definitions/532.html
    - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
