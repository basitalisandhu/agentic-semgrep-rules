# agentic-semgrep-rules: single-file bundle, generated by scripts/bundle.py from rules/.
# Do not edit by hand; edit the rule under rules/<language>/<category>/ and rerun the script.
# 36 rules. Ids are prefixed with language and category so none collide.
# https://github.com/basitalisandhu/agentic-semgrep-rules (MIT)
rules:
- id: javascript.code-execution.llm-output-to-child-process
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: 'Text returned by a language model is passed to child_process (''$SINK'') as a command, or
    as an argument with shell: true. A prompt injection in any page, document or tool result the model
    has read becomes OS command injection with this process''s privileges. Do not let the model compose
    commands. Expose fixed executables as tools, pass model-chosen values as separate array arguments
    to execFile or spawn without shell: true, validate them against an allowlist, and run with least privilege
    and a timeout.'
  mode: taint
  pattern-sources:
  - pattern: $CLIENT.chat.completions.create(...)
    exact: true
  - pattern: $CLIENT.responses.create(...)
    exact: true
  - pattern: $CLIENT.messages.create(...)
    exact: true
  - pattern: generateText(...)
    exact: true
  - pattern: streamText(...)
    exact: true
  - pattern: generateObject(...)
    exact: true
  - pattern: ollama.chat(...)
    exact: true
  - pattern: ollama.generate(...)
    exact: true
  - pattern: $MODEL.generateContent(...)
    exact: true
  - pattern: $CLIENT.models.generateContent(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern: $X.invoke(...)
      - pattern: $X.run(...)
      - pattern: $X.predict(...)
      - pattern: $X.stream(...)
      - pattern: $X.batch(...)
    - metavariable-regex:
        metavariable: $X
        regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
    exact: true
  - pattern: $R.choices[0].message.content
  - pattern: $R.choices[0].text
  - pattern: $R.output_text
  - pattern: $R.content[0].text
  - pattern: $R.response.text()
  pattern-sanitizers:
  - pattern: parseInt(...)
  - pattern: Number(...)
  - pattern: shellQuote.quote(...)
  - pattern: shellEscape(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
      - pattern: spawn($CMD, ...)
      - pattern: spawnSync($CMD, ...)
      - pattern: execFile($CMD, ...)
      - pattern: execFileSync($CMD, ...)
      - pattern: $CP.exec($CMD, ...)
      - pattern: $CP.execSync($CMD, ...)
      - pattern: $CP.spawn($CMD, ...)
      - pattern: $CP.spawnSync($CMD, ...)
      - pattern: $CP.execFile($CMD, ...)
      - pattern: $CP.execFileSync($CMD, ...)
      - pattern: execa.command($CMD, ...)
      - pattern: execaCommand($CMD, ...)
    - focus-metavariable: $CMD
  - patterns:
    - pattern-either:
      - pattern: 'spawn($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: 'spawnSync($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: 'execFile($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: 'execFileSync($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: '$CP.spawn($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: '$CP.spawnSync($PROG, $ARGS, {..., shell: true, ...})'
      - pattern: '$CP.execFile($PROG, $ARGS, {..., shell: true, ...})'
    - focus-metavariable: $ARGS
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
    confidence: HIGH
    likelihood: HIGH
    impact: HIGH
    technology:
    - javascript
    - typescript
    - node
    - child_process
    - openai
    - anthropic
    - langchain
    - vercel-ai
    - llm
    - agent
    references:
    - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    - https://cwe.mitre.org/data/definitions/78.html
    - https://nodejs.org/api/child_process.html#child_processexeccommand-options-callback
    masoon:
      pack: agentic-semgrep-rules
      family: llm-output-to-sink
- id: javascript.code-execution.llm-output-to-eval-function
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Text returned by a language model flows into '$SINK', which compiles and runs it as JavaScript.
    A prompt injection in any page, document or tool result the model has read becomes arbitrary code
    execution in this process (the vm module is not a security boundary). Do not execute model output.
    If generated code must run, use an isolated sandbox (isolated-vm, a WebAssembly runtime, or a separate
    container with no secrets, no network and a timeout) and treat its result as untrusted data.
  mode: taint
  pattern-sources:
  - pattern: $CLIENT.chat.completions.create(...)
    exact: true
  - pattern: $CLIENT.responses.create(...)
    exact: true
  - pattern: $CLIENT.messages.create(...)
    exact: true
  - pattern: generateText(...)
    exact: true
  - pattern: streamText(...)
    exact: true
  - pattern: generateObject(...)
    exact: true
  - pattern: ollama.chat(...)
    exact: true
  - pattern: ollama.generate(...)
    exact: true
  - pattern: $MODEL.generateContent(...)
    exact: true
  - pattern: $CLIENT.models.generateContent(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern: $X.invoke(...)
      - pattern: $X.run(...)
      - pattern: $X.predict(...)
      - pattern: $X.stream(...)
      - pattern: $X.batch(...)
    - metavariable-regex:
        metavariable: $X
        regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
    exact: true
  - pattern: $R.choices[0].message.content
  - pattern: $R.choices[0].text
  - pattern: $R.output_text
  - pattern: $R.content[0].text
  - pattern: $R.response.text()
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($CODE)
      - pattern: new Function(..., $CODE)
      - pattern: Function(..., $CODE)
      - pattern: vm.runInContext($CODE, ...)
      - pattern: vm.runInNewContext($CODE, ...)
      - pattern: vm.runInThisContext($CODE, ...)
      - pattern: new vm.Script($CODE, ...)
      - pattern: vm.compileFunction($CODE, ...)
      - pattern: runInContext($CODE, ...)
      - pattern: runInNewContext($CODE, ...)
      - pattern: runInThisContext($CODE, ...)
      - pattern: new Script($CODE, ...)
      - pattern: $ISOLATE.compileScript($CODE, ...)
      - pattern: $CTX.eval($CODE, ...)
      - pattern: setTimeout($CODE, ...)
      - pattern: setInterval($CODE, ...)
    - focus-metavariable: $CODE
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (''Eval Injection'')'
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
    confidence: HIGH
    likelihood: HIGH
    impact: HIGH
    technology:
    - javascript
    - typescript
    - node
    - vm
    - openai
    - anthropic
    - langchain
    - vercel-ai
    - llm
    - agent
    references:
    - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    - https://cwe.mitre.org/data/definitions/95.html
    - https://nodejs.org/api/vm.html#vm-executing-javascript
    masoon:
      pack: agentic-semgrep-rules
      family: llm-output-to-sink
- id: javascript.injection.llm-output-to-fetch
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: 'A URL chosen by a language model is requested by ''$SINK''. A prompt injection can point the
    agent at internal services (cloud metadata endpoints, admin panels, localhost ports) or at an attacker''s
    server to exfiltrate data: server-side request forgery through a tool URL. Validate the URL before
    fetching: parse it with new URL(), allow only http and https, resolve the host and reject private,
    loopback and link-local ranges, apply a host allowlist where possible, disable or re-validate redirects,
    and set timeouts and response size limits.'
  mode: taint
  pattern-sources:
  - pattern: $CLIENT.chat.completions.create(...)
    exact: true
  - pattern: $CLIENT.responses.create(...)
    exact: true
  - pattern: $CLIENT.messages.create(...)
