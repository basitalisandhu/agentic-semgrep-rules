  severity: WARNING
  message: '''$TOOL'' gives the model an unrestricted shell or Python interpreter inside this process.
    Any prompt injection in a document, web page or tool result becomes arbitrary code execution with
    this process''s credentials, network access and filesystem. Prefer narrow, typed tools that do one
    thing with validated arguments. If code execution is a product requirement, run it in an isolated
    sandbox (separate container or microVM, no secrets, no network, time and memory limits) and require
    human approval for anything that leaves the sandbox.'
