- id: python.permissions.langchain-allow-dangerous-requests
  languages:
  - python
  severity: WARNING
  message: '''allow_dangerous_requests=True'' lets the model issue arbitrary HTTP requests (RequestsToolkit,
    OpenAPI toolkits), including POST, PUT and DELETE, to any URL it chooses. A prompt injection can target
    internal services and cloud metadata endpoints or exfiltrate data: server-side request forgery with
    the agent''s network position. Remove the flag, restrict the toolkit to GET, and wrap it with a host
    allowlist and private-range blocking.'
