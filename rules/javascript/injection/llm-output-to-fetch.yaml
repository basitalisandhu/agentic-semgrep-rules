rules:
  - id: llm-output-to-fetch
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A URL chosen by a language model is requested by '$SINK'. A prompt injection can point the
      agent at internal services (cloud metadata endpoints, admin panels, localhost ports) or at an
      attacker's server to exfiltrate data: server-side request forgery through a tool URL.
      Validate the URL before fetching: parse it with new URL(), allow only http and https, resolve
      the host and reject private, loopback and link-local ranges, apply a host allowlist where
      possible, disable or re-validate redirects, and set timeouts and response size limits.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: generateText(...)
        exact: true
      - pattern: streamText(...)
        exact: true
      - pattern: generateObject(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generateContent(...)
        exact: true
      - pattern: $CLIENT.models.generateContent(...)
        exact: true
      # Framework calls (LangChain, LangGraph, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.run(...)
              - pattern: $X.predict(...)
              - pattern: $X.stream(...)
              - pattern: $X.batch(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R.response.text()
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
      - pattern: encodeURI(...)
      - pattern: validateUrl(...)
      - pattern: assertSafeUrl(...)
      - pattern: isSafeUrl(...)
      - pattern: $X.validateUrl(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: axios.$METHOD($URL, ...)
              - pattern: $AXIOS.$METHOD($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: ky.$METHOD($URL, ...)
              - pattern: superagent.$METHOD($URL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|request)$
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: globalThis.fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
              - pattern: ky($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
              - pattern: $PAGE.goto($URL, ...)
              - pattern: new CheerioWebBaseLoader($URL, ...)
              - pattern: new PuppeteerWebBaseLoader($URL, ...)
          - focus-metavariable: $URL
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "LLM05:2025 Improper Output Handling"
        - "LLM06:2025 Excessive Agency"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [javascript, typescript, node, fetch, axios, got, puppeteer, openai, anthropic, langchain, llm, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/918.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      hisar:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
