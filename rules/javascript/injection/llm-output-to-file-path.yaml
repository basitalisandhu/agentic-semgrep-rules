rules:
  - id: llm-output-to-file-path
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A file path chosen by a language model is used by '$SINK' without containment checks.
      A prompt injection can read or overwrite any file this process can reach (.env files, SSH
      keys, source code, other users' data): path traversal through a tool argument. Resolve the
      path against a fixed base directory with path.resolve, verify the result still starts with
      that base (plus path.sep), reject symlinks where appropriate, and apply an allowlist of
      names or extensions.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: generateText(...)
        exact: true
      - pattern: streamText(...)
        exact: true
      - pattern: generateObject(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generateContent(...)
        exact: true
      - pattern: $CLIENT.models.generateContent(...)
        exact: true
      # Framework calls (LangChain, LangGraph, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.run(...)
              - pattern: $X.predict(...)
              - pattern: $X.stream(...)
              - pattern: $X.batch(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R.response.text()
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: sanitizeFilename(...)
      - pattern: sanitize(...)
      - pattern: safeJoin(...)
      - pattern: resolveInside(...)
      - patterns:
          - pattern-inside: |
              if (!$P.startsWith(...)) { ... }
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if ($P.startsWith(...)) { ... }
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if (!$ALLOWED.includes($P)) { ... }
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if (!$ALLOWED.has($P)) { ... }
              ...
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.$METHOD($PATH, ...)
              - pattern: fs.promises.$METHOD($PATH, ...)
              - pattern: fsp.$METHOD($PATH, ...)
              - pattern: fsPromises.$METHOD($PATH, ...)
              - pattern: fse.$METHOD($PATH, ...)
              - pattern: $FS.$METHOD($PATH, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|rmdir|rmdirSync|readdir|readdirSync|mkdir|mkdirSync|createReadStream|createWriteStream|open|openSync|readJson|readJsonSync|writeJson|writeJsonSync|outputFile|outputFileSync|remove|removeSync|copy|copySync|copyFile|copyFileSync|rename|renameSync|stat|statSync|access|accessSync|readTextFile|writeTextFile)$
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: Bun.file($PATH, ...)
              - pattern: Bun.write($PATH, ...)
              - pattern: Deno.readTextFile($PATH, ...)
              - pattern: Deno.writeTextFile($PATH, ...)
              - pattern: Deno.readFile($PATH, ...)
              - pattern: Deno.remove($PATH, ...)
              - pattern: $RES.sendFile($PATH, ...)
              - pattern: $RES.download($PATH, ...)
              - pattern: new TextLoader($PATH, ...)
              - pattern: new PDFLoader($PATH, ...)
              - pattern: new DirectoryLoader($PATH, ...)
          - focus-metavariable: $PATH
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "LLM05:2025 Improper Output Handling"
        - "LLM06:2025 Excessive Agency"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [javascript, typescript, node, fs, bun, deno, openai, anthropic, langchain, llm, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/22.html
        - https://nodejs.org/api/path.html#pathresolvepaths
      masoon:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
