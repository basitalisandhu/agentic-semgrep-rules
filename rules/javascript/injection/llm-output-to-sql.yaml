rules:
  - id: llm-output-to-sql
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Text returned by a language model is used as a SQL statement (or interpolated into one) and
      executed by '$SINK'. A prompt injection becomes SQL injection: data exfiltration, modification
      or deletion with the privileges of the database user. Never execute model-written SQL
      directly. Use parameterised queries where the model only supplies values (query(text, [values]),
      Prisma.sql tagged templates, knex bindings), or run model-generated SQL on a read-only
      connection restricted to an allowlisted schema with statement timeouts.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: generateText(...)
        exact: true
      - pattern: streamText(...)
        exact: true
      - pattern: generateObject(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generateContent(...)
        exact: true
      - pattern: $CLIENT.models.generateContent(...)
        exact: true
      # Framework calls (LangChain, LangGraph, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.run(...)
              - pattern: $X.predict(...)
              - pattern: $X.stream(...)
              - pattern: $X.batch(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R.response.text()
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: $DB.escape(...)
      - pattern: mysql.escape(...)
      - pattern: sqlstring.escape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($QUERY, ...)
              - pattern: $DB.execute($QUERY, ...)
              - pattern: $DB.raw($QUERY, ...)
              - pattern: $DB.prepare($QUERY, ...)
              - pattern: $PRISMA.$queryRawUnsafe($QUERY, ...)
              - pattern: $PRISMA.$executeRawUnsafe($QUERY, ...)
              - pattern: $SEQ.query($QUERY, ...)
              - pattern: $DB.unsafe($QUERY, ...)
              - pattern: $DRIZZLE.execute(sql.raw($QUERY))
              - pattern: sql.raw($QUERY)
          - focus-metavariable: $QUERY
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "LLM05:2025 Improper Output Handling"
        - "LLM06:2025 Excessive Agency"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node, sql, prisma, knex, sequelize, pg, mysql, openai, anthropic, langchain, llm, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/89.html
        - https://www.prisma.io/docs/orm/prisma-client/using-raw-sql/raw-queries#sql-injection-prevention
      hisar:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
