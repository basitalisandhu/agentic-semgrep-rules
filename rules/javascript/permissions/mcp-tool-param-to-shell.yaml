rules:
  - id: mcp-tool-param-to-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Tool argument '$PARAM' is filled in by the model and reaches '$SINK' as a shell command or
      executable. This is an "execute anything" tool: a prompt injection anywhere in the agent's
      context becomes OS command injection on the host running the MCP server. Replace the free-form
      command with a fixed executable and typed arguments, validate each argument against an
      allowlist in the tool's schema and code, use execFile or spawn without shell: true, run with
      least privilege and a timeout, and require human approval for anything with side effects.
    mode: taint
    pattern-sources:
      # Arguments of MCP tool handlers (official TypeScript SDK) and LangChain / AI SDK tools.
      # The model fills these in, so they carry whatever a prompt injection wants them to carry.
      - patterns:
          - pattern-either:
              - pattern-inside: $SERVER.tool($NAME, ..., async ({..., $PARAM, ...}) => {...})
              - pattern-inside: $SERVER.tool($NAME, ..., ({..., $PARAM, ...}) => {...})
              - pattern-inside: '$SERVER.tool($NAME, ..., async ({..., $KEY: $PARAM, ...}) => {...})'
              - pattern-inside: '$SERVER.registerTool($NAME, ..., async ({..., $KEY: $PARAM, ...}) => {...})'
              - pattern-inside: 'tool({..., execute: async ({..., $KEY: $PARAM, ...}) => {...}, ...})'
              - pattern-inside: $SERVER.registerTool($NAME, ..., async ({..., $PARAM, ...}) => {...})
              - pattern-inside: $SERVER.registerTool($NAME, ..., ({..., $PARAM, ...}) => {...})
              - pattern-inside: tool(async ({..., $PARAM, ...}) => {...}, ...)
              - pattern-inside: tool(({..., $PARAM, ...}) => {...}, ...)
              - pattern-inside: "tool({..., execute: async ({..., $PARAM, ...}) => {...}, ...})"
              - pattern-inside: "new DynamicStructuredTool({..., func: async ({..., $PARAM, ...}) => {...}, ...})"
          - pattern: $PARAM
      - patterns:
          - pattern-either:
              - pattern-inside: $SERVER.tool($NAME, ..., async ($ARGS) => {...})
              - pattern-inside: $SERVER.tool($NAME, ..., async ($ARGS, $EXTRA) => {...})
              - pattern-inside: $SERVER.registerTool($NAME, ..., async ($ARGS) => {...})
              - pattern-inside: $SERVER.registerTool($NAME, ..., async ($ARGS, $EXTRA) => {...})
              - pattern-inside: $SERVER.setRequestHandler(CallToolRequestSchema, async ($ARGS) => {...})
          - pattern-either:
              - pattern: $ARGS.$FIELD
              - pattern: $ARGS.params.arguments
              - pattern: $ARGS.params.arguments.$FIELD
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: shellQuote.quote(...)
      - pattern: shellEscape(...)
      - patterns:
          - pattern-inside: |
              if (!$ALLOWED.includes($P)) { ... }
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if (!$ALLOWED.has($P)) { ... }
              ...
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: spawn($CMD, ...)
              - pattern: spawnSync($CMD, ...)
              - pattern: execFile($CMD, ...)
              - pattern: execFileSync($CMD, ...)
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: $CP.spawn($CMD, ...)
              - pattern: $CP.spawnSync($CMD, ...)
              - pattern: $CP.execFile($CMD, ...)
              - pattern: $CP.execFileSync($CMD, ...)
              - pattern: execa.command($CMD, ...)
              - pattern: execaCommand($CMD, ...)
              - pattern: Bun.spawn([$CMD, ...], ...)
              - pattern: Bun.spawnSync([$CMD, ...], ...)
              - pattern: new Deno.Command($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: 'spawn($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: 'spawnSync($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: 'execFile($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: 'execFileSync($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: '$CP.spawn($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: '$CP.spawnSync($PROG, $ARGS, {..., shell: true, ...})'
              - pattern: '$CP.execFile($PROG, $ARGS, {..., shell: true, ...})'
          - focus-metavariable: $ARGS
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "LLM06:2025 Excessive Agency"
        - "LLM05:2025 Improper Output Handling"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node, mcp, modelcontextprotocol, langchain, vercel-ai, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
        - https://cwe.mitre.org/data/definitions/78.html
        - https://modelcontextprotocol.io/specification/2025-06-18/server/tools#security-considerations
        - https://github.com/modelcontextprotocol/typescript-sdk
      masoon:
        pack: agentic-semgrep-rules
        family: excessive-agency
