rules:
  - id: api-key-in-command-line-arg
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      An API key or token is accepted or passed as a command-line argument. Command lines are
      visible to every user on the host (ps, /proc), end up in shell history, process monitors,
      crash reports and CI logs. Read the secret from an environment variable, a file with
      restricted permissions, or a secrets manager instead, and if a child process needs it pass
      it through its env option.
    patterns:
      - pattern-either:
          # commander, yargs, meow and friends: defining a key flag
          - patterns:
              - pattern-either:
                  - pattern: $PROGRAM.option("$FLAG", ...)
                  - pattern: $PROGRAM.requiredOption("$FLAG", ...)
                  - pattern: $PROGRAM.option("$SHORT", "$FLAG", ...)
                  - pattern: $YARGS.option("$FLAG", ...)
                  - pattern: '$YARGS.options({..., "$FLAG": $CFG, ...})'
                  - pattern: '$YARGS.options({..., $FLAG: $CFG, ...})'
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^(--?)?(([A-Za-z0-9]+[-_])?(api[-_]?key|apiKey|apikey|secret[-_]?key|secretKey|access[-_]?token|accessToken|auth[-_]?token|authToken|bearer[-_]?token|hf[-_]token|hfToken|token)|(openai|anthropic|hf|huggingface|groq|mistral|cohere|google|gemini|azure|aws|replicate|together)[-_]?(key|Key|secret|Secret)|key|secret)(\s.*)?$
          # a provider client built straight from argv
          - pattern: 'new $CLIENT({..., apiKey: process.argv[$I], ...})'
          # launching a child process with a key flag or value on its command line
          - patterns:
              - pattern-either:
                  - pattern: $CP.$FUNC($PROG, [..., "$FLAG", $VALUE, ...], ...)
                  - pattern: $FUNC($PROG, [..., "$FLAG", $VALUE, ...], ...)
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(spawn|spawnSync|execFile|execFileSync|fork|execa)$
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^--?([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token|key)$
          - patterns:
              - pattern-either:
                  - pattern: $CP.$FUNC($PROG, [..., $ARG, ...], ...)
                  - pattern: $FUNC($PROG, [..., $ARG, ...], ...)
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(spawn|spawnSync|execFile|execFileSync|fork|execa)$
              - metavariable-regex:
                  metavariable: $ARG
                  regex: ^[`"']--?([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)=\$\{.*$
          - patterns:
              - pattern-either:
                  - pattern: $CP.$FUNC($PROG, [..., process.env.$ENV, ...], ...)
                  - pattern: $FUNC($PROG, [..., process.env.$ENV, ...], ...)
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(spawn|spawnSync|execFile|execFileSync|fork|execa)$
              - metavariable-regex:
                  metavariable: $ENV
                  regex: (?i)^.*(api[_-]?key|secret|token|password).*$
    metadata:
      category: security
      subcategory: [audit]
      cwe:
        - "CWE-214: Invocation of Process Using Visible Sensitive Information"
      owasp:
        - "LLM02:2025 Sensitive Information Disclosure"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node, commander, yargs, child_process, secrets, llm]
      references:
        - https://cwe.mitre.org/data/definitions/214.html
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
        - https://nodejs.org/api/child_process.html
      hisar:
        pack: agentic-semgrep-rules
        family: secrets
