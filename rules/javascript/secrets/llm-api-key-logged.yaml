rules:
  - id: llm-api-key-logged
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A secret read from the environment (an API key, token or password, or the whole process.env
      after dotenv.config()) is written to the console or a logger. Logs are copied to CI output,
      log aggregators, crash reports and support tickets, so this is a credential leak. Never log
      secrets; log only whether a key is set, or a masked suffix, and keep process.env out of
      debug dumps.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: process.env.$KEY
              - pattern: process.env[$KEY]
              - pattern: Deno.env.get($KEY)
              - pattern: Bun.env.$KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^.*(api[_-]?key|secret|token|password|credential).*$
      - patterns:
          - pattern-either:
              - pattern-inside: $FUNC(..., process.env, ...)
              - pattern-inside: $OBJ.$FUNC(..., process.env, ...)
          - pattern: process.env
      - pattern: dotenv.config(...).parsed
    pattern-sanitizers:
      - pattern: Boolean(...)
      - pattern: '!!$X'
      - pattern: $X.length
      - pattern: $X.slice(-4)
      - pattern: $X.slice(0, 4)
      - pattern: $X.substring(...)
      - pattern: mask(...)
      - pattern: redact(...)
      - pattern: '$X ? "set" : "missing"'
      - pattern: '$X ? "set" : "unset"'
    pattern-sinks:
      - patterns:
          - pattern: console.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(log|info|debug|warn|error|trace|dir|table)$
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: ^(logger|log|winston|pino|bunyan|LOG|Logger|this\.logger|this\.log|app\.log|fastify\.log|req\.log|request\.log|server\.log|signale|consola)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(log|info|debug|warn|error|trace|fatal|silly|verbose|child)$
      - pattern: process.stdout.write(...)
      - pattern: process.stderr.write(...)
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "LLM02:2025 Sensitive Information Disclosure"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [javascript, typescript, node, dotenv, winston, pino, secrets, llm]
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
        - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
      masoon:
        pack: agentic-semgrep-rules
        family: secrets
