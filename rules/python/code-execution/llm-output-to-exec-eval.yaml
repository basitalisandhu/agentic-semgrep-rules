rules:
  - id: llm-output-to-exec-eval
    languages: [python]
    severity: ERROR
    message: >-
      Text returned by a language model flows into '$SINK', which executes it as Python.
      A prompt injection in any document, web page or tool result the model has read becomes
      arbitrary code execution in this process. Do not execute model output. If the agent must
      run generated code, run it in an isolated sandbox (separate container or microVM, no network,
      no credentials, time limit) and treat the result as untrusted data.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: litellm.completion(...)
        exact: true
      - pattern: litellm.acompletion(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generate_content(...)
        exact: true
      - pattern: $CLIENT.models.generate_content(...)
        exact: true
      # Framework calls (LangChain, LangGraph, CrewAI, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.ainvoke(...)
              - pattern: $X.run(...)
              - pattern: $X.arun(...)
              - pattern: $X.predict(...)
              - pattern: $X.chat(...)
              - pattern: $X.kickoff(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R["choices"][0]["message"]["content"]
      - pattern: $R["message"]["content"]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CODE, ...)
              - pattern: eval($CODE, ...)
              - pattern: compile($CODE, ...)
              - pattern: builtins.exec($CODE, ...)
              - pattern: builtins.eval($CODE, ...)
              - pattern: ast.literal_eval($CODE, ...)
          - focus-metavariable: $CODE
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "LLM05:2025 Improper Output Handling"
        - "LLM06:2025 Excessive Agency"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python, openai, anthropic, langchain, litellm, ollama, llm, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/95.html
        - https://python.langchain.com/docs/security/
      hisar:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
