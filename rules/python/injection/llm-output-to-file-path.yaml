rules:
  - id: llm-output-to-file-path
    languages: [python]
    severity: WARNING
    message: >-
      A file path chosen by a language model is used by '$SINK' without containment checks.
      A prompt injection can read or overwrite any file this process can reach (secrets, SSH keys,
      source code, other users' data): path traversal through a tool argument. Resolve the path
      against a fixed base directory, verify the resolved path is still inside it
      (Path.resolve() plus is_relative_to), reject symlinks where appropriate, and apply an
      allowlist of extensions or names.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: litellm.completion(...)
        exact: true
      - pattern: litellm.acompletion(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generate_content(...)
        exact: true
      - pattern: $CLIENT.models.generate_content(...)
        exact: true
      # Framework calls (LangChain, LangGraph, CrewAI, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.ainvoke(...)
              - pattern: $X.run(...)
              - pattern: $X.arun(...)
              - pattern: $X.predict(...)
              - pattern: $X.chat(...)
              - pattern: $X.kickoff(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R["choices"][0]["message"]["content"]
      - pattern: $R["message"]["content"]
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: safe_join(...)
      - patterns:
          - pattern-inside: |
              if not $P.is_relative_to(...):
                ...
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if not $P.startswith(...):
                ...
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if not str($P).startswith(...):
                ...
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if $P.is_relative_to(...):
                ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if $P not in $ALLOWED:
                ...
              ...
          - pattern: $P
      - patterns:
          - pattern-inside: |
              if $P in $ALLOWED:
                ...
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: codecs.open($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: os.rmdir($PATH)
              - pattern: os.makedirs($PATH, ...)
              - pattern: os.listdir($PATH)
              - pattern: os.rename($PATH, ...)
              - pattern: os.rename($SRC, $PATH)
              - pattern: shutil.rmtree($PATH, ...)
              - pattern: shutil.copy($PATH, ...)
              - pattern: shutil.copy($SRC, $PATH)
              - pattern: shutil.move($PATH, ...)
              - pattern: shutil.move($SRC, $PATH)
              - pattern: pathlib.Path($PATH, ...)
              - pattern: Path($PATH, ...)
              - pattern: send_file($PATH, ...)
              - pattern: FileResponse($PATH, ...)
              - pattern: TextLoader($PATH, ...)
              - pattern: PyPDFLoader($PATH, ...)
              - pattern: CSVLoader($PATH, ...)
              - pattern: DirectoryLoader($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: $PATH.read_text(...)
              - pattern: $PATH.read_bytes(...)
              - pattern: $PATH.write_text(...)
              - pattern: $PATH.write_bytes(...)
              - pattern: $PATH.open(...)
              - pattern: $PATH.unlink(...)
              - pattern: $PATH.rmdir(...)
              - pattern: $PATH.mkdir(...)
              - pattern: $PATH.iterdir(...)
          - focus-metavariable: $PATH
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "LLM05:2025 Improper Output Handling"
        - "LLM06:2025 Excessive Agency"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, langchain, openai, anthropic, llm, agent]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/22.html
        - https://docs.python.org/3/library/pathlib.html#pathlib.PurePath.is_relative_to
      hisar:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
