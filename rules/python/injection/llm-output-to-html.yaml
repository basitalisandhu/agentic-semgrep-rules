rules:
  - id: llm-output-to-html
    languages: [python]
    severity: WARNING
    message: >-
      Text returned by a language model is rendered as raw HTML by '$SINK'. Models can be made to
      emit script tags, event handlers or markdown with embedded HTML, which turns a prompt injection
      into cross-site scripting against whoever views the answer (session theft, actions in the
      user's browser). Render model output as text, or convert markdown with HTML disabled and
      sanitise the result with an allowlist (for example bleach or nh3) before marking it safe.
    mode: taint
    pattern-sources:
      # Vendor SDK calls that return a model response object.
      - pattern: $CLIENT.chat.completions.create(...)
        exact: true
      - pattern: $CLIENT.responses.create(...)
        exact: true
      - pattern: $CLIENT.messages.create(...)
        exact: true
      - pattern: litellm.completion(...)
        exact: true
      - pattern: litellm.acompletion(...)
        exact: true
      - pattern: ollama.chat(...)
        exact: true
      - pattern: ollama.generate(...)
        exact: true
      - pattern: $MODEL.generate_content(...)
        exact: true
      - pattern: $CLIENT.models.generate_content(...)
        exact: true
      # Framework calls (LangChain, LangGraph, CrewAI, agents) on an object whose name says it is a model, chain or agent.
      - patterns:
          - pattern-either:
              - pattern: $X.invoke(...)
              - pattern: $X.ainvoke(...)
              - pattern: $X.run(...)
              - pattern: $X.arun(...)
              - pattern: $X.predict(...)
              - pattern: $X.chat(...)
              - pattern: $X.kickoff(...)
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(.*(agent|chain|llm|model|graph|runnable|executor|crew|pipeline|chat|assistant|bot|ollama|completion)\w*|app|workflow)$
        exact: true
      # Response shapes that are unique to model SDKs, for when the response arrives through a parameter.
      - pattern: $R.choices[0].message.content
      - pattern: $R.choices[0].text
      - pattern: $R.output_text
      - pattern: $R.content[0].text
      - pattern: $R["choices"][0]["message"]["content"]
      - pattern: $R["message"]["content"]
    pattern-sanitizers:
      - pattern: bleach.clean(...)
      - pattern: nh3.clean(...)
      - pattern: html.escape(...)
      - pattern: escape(...)
      - pattern: markupsafe.escape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Markup($HTML)
              - pattern: markupsafe.Markup($HTML)
              - pattern: flask.Markup($HTML)
              - pattern: render_template_string($HTML, ...)
              - pattern: flask.render_template_string($HTML, ...)
              - pattern: HTMLResponse(content=$HTML, ...)
              - pattern: HTMLResponse($HTML, ...)
              - pattern: mark_safe($HTML)
              - pattern: django.utils.safestring.mark_safe($HTML)
              - pattern: st.markdown($HTML, ..., unsafe_allow_html=True)
              - pattern: st.markdown($HTML, unsafe_allow_html=True, ...)
              - pattern: st.html($HTML, ...)
              - pattern: st.components.v1.html($HTML, ...)
              - pattern: components.html($HTML, ...)
              - pattern: gr.HTML($HTML, ...)
              - pattern: gradio.HTML($HTML, ...)
              - pattern: IPython.display.HTML($HTML, ...)
              - pattern: display(HTML($HTML, ...))
          - focus-metavariable: $HTML
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "LLM05:2025 Improper Output Handling"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, flask, fastapi, django, streamlit, gradio, openai, anthropic, langchain, llm]
      references:
        - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
        - https://cwe.mitre.org/data/definitions/79.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      hisar:
        pack: agentic-semgrep-rules
        family: llm-output-to-sink
