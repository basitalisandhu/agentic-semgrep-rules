rules:
  - id: langchain-allow-dangerous-requests
    languages: [python]
    severity: WARNING
    message: >-
      'allow_dangerous_requests=True' lets the model issue arbitrary HTTP requests (RequestsToolkit, OpenAPI toolkits), including POST, PUT and DELETE, to any URL it chooses. A prompt injection can target internal services and cloud metadata endpoints or exfiltrate data: server-side request forgery with the agent's network position. Remove the flag, restrict the toolkit to GET, and wrap it with a host allowlist and private-range blocking.
    patterns:
      - pattern-either:
          - pattern: $CALL(..., allow_dangerous_requests=True, ...)
          - pattern: $OBJ.$CALL(..., allow_dangerous_requests=True, ...)
    metadata:
      category: security
      subcategory: [audit]
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "LLM06:2025 Excessive Agency"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, langchain, langchain-community, langchain-experimental, llm, agent]
      references:
        - https://python.langchain.com/docs/security/
        - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
        - https://cwe.mitre.org/data/definitions/918.html
        - https://python.langchain.com/docs/integrations/tools/requests/
      pack:
        pack: agentic-semgrep-rules
        family: excessive-agency
