rules:
  - id: api-key-in-command-line-arg
    languages: [python]
    severity: WARNING
    message: >-
      An API key or token is accepted or passed as a command-line argument. Command lines are
      visible to every user on the host (ps, /proc), end up in shell history, process monitors,
      crash reports and CI logs. Read the secret from an environment variable, a file with
      restricted permissions, or a secrets manager instead, and if a child process needs it pass
      it through its environment.
    patterns:
      - pattern-either:
          # argparse / click / typer definitions of a key flag
          - patterns:
              - pattern-either:
                  - pattern: $PARSER.add_argument("$FLAG", ...)
                  - pattern: $PARSER.add_argument("$SHORT", "$FLAG", ...)
                  - pattern: click.option("$FLAG", ...)
                  - pattern: typer.Option(..., "$FLAG", ...)
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^--?(([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)|(openai|anthropic|hf|huggingface|groq|mistral|cohere|google|gemini|azure|aws|replicate|together)[-_]?(key|secret)|key|secret)$
          # launching a child process with a key flag or value on its command line
          - patterns:
              - pattern: subprocess.$FUNC([..., "$FLAG", $VALUE, ...], ...)
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^--?(([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)|(openai|anthropic|hf|huggingface|groq|mistral|cohere|google|gemini|azure|aws|replicate|together)[-_]?(key|secret)|key|secret)$
          - patterns:
              - pattern: subprocess.$FUNC([..., $ARG, ...], ...)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: ^(f["']|["'].*\+\s*)?--?([A-Za-z0-9]+[-_])?(api[-_]?key|apikey|secret[-_]?key|access[-_]?token|auth[-_]?token|bearer[-_]?token|hf[-_]token|token)=.*$
          - patterns:
              - pattern-either:
                  - pattern: subprocess.$FUNC([..., os.environ["$ENV"], ...], ...)
                  - pattern: subprocess.$FUNC([..., os.getenv("$ENV", ...), ...], ...)
                  - pattern: subprocess.$FUNC([..., os.environ.get("$ENV", ...), ...], ...)
              - metavariable-regex:
                  metavariable: $ENV
                  regex: (?i)^.*(api[_-]?key|secret|token|password).*$
    metadata:
      category: security
      subcategory: [audit]
      cwe:
        - "CWE-214: Invocation of Process Using Visible Sensitive Information"
      owasp:
        - "LLM02:2025 Sensitive Information Disclosure"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, argparse, click, typer, subprocess, secrets, llm]
      references:
        - https://cwe.mitre.org/data/definitions/214.html
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
        - https://docs.python.org/3/library/subprocess.html#security-considerations
      hisar:
        pack: agentic-semgrep-rules
        family: secrets
