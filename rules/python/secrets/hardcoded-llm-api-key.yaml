rules:
  - id: hardcoded-llm-api-key
    languages: [python]
    severity: ERROR
    message: >-
      A model-provider API key is hard-coded in source. Anyone with read access to this file or its
      history (a fork, a container image, a CI log, a leaked backup) can spend against your account,
      exfiltrate data through your provider, and impersonate your agent. Revoke this key now, then
      load keys from an environment variable or a secrets manager at runtime and add a secret
      scanner (gitleaks, trufflehog or GitHub secret scanning) to CI.
    pattern-either:
      # OpenAI: sk-..., sk-proj-..., sk-svcacct-..., sk-admin-... (project keys are long and may contain underscores)
      - pattern-regex: (?<![A-Za-z0-9_\-])sk-(proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{32,}(?![A-Za-z0-9_\-])
      # Anthropic: sk-ant-api03-... / sk-ant-admin01-...
      - pattern-regex: (?<![A-Za-z0-9_\-])sk-ant-(api|admin)[0-9]{2}-[A-Za-z0-9_\-]{32,}(?![A-Za-z0-9_\-])
      # Hugging Face user access tokens
      - pattern-regex: (?<![A-Za-z0-9_])hf_[A-Za-z0-9]{30,}(?![A-Za-z0-9_])
      # Groq, Replicate, Perplexity, Together, Mistral-style and xAI keys
      - pattern-regex: (?<![A-Za-z0-9_\-])(gsk_[A-Za-z0-9]{40,}|r8_[A-Za-z0-9]{36,}|pplx-[A-Za-z0-9]{40,}|xai-[A-Za-z0-9_\-]{40,})(?![A-Za-z0-9_\-])
      # Google AI Studio keys
      - pattern-regex: (?<![A-Za-z0-9_\-])AIza[0-9A-Za-z_\-]{35}(?![A-Za-z0-9_\-])
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "LLM02:2025 Sensitive Information Disclosure"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python, openai, anthropic, huggingface, groq, replicate, secrets, llm]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
        - https://huggingface.co/docs/hub/security-tokens
        - https://docs.github.com/en/code-security/secret-scanning/introduction/supported-secret-scanning-patterns
      masoon:
        pack: agentic-semgrep-rules
        family: secrets
