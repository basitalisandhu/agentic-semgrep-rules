rules:
  - id: llm-api-key-logged
    languages: [python]
    severity: WARNING
    message: >-
      A secret read from the environment (an API key, token or password, or the whole environment
      after load_dotenv) is written to stdout or a log. Logs are copied to CI output, log
      aggregators, crash reports and support tickets, so this is a credential leak. Never print
      secrets; log only whether a key is set, or a masked suffix, and keep the process environment
      out of debug dumps.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: os.environ[$KEY]
              - pattern: os.environ.get($KEY, ...)
              - pattern: os.getenv($KEY, ...)
              - pattern: dotenv_values(...)[$KEY]
              - pattern: config($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^.*(api[_-]?key|secret|token|password|credential).*$
      - patterns:
          - pattern-either:
              - pattern-inside: $FUNC(..., os.environ, ...)
              - pattern-inside: $OBJ.$FUNC(..., os.environ, ...)
          - pattern: os.environ
      - pattern: dotenv_values(...)
        exact: true
    pattern-sanitizers:
      - pattern: bool(...)
      - pattern: len(...)
      - pattern: $X is None
      - pattern: $X is not None
      - pattern: mask(...)
      - pattern: redact(...)
      - pattern: $X[-4:]
      - pattern: $X[:4]
      - pattern: $X[-6:]
    pattern-sinks:
      - pattern: print(...)
      - pattern: pprint(...)
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|warn|error|critical|exception|log|success|trace)$
          - metavariable-regex:
              metavariable: $LOGGER
              regex: ^(logging|logger|log|LOGGER|LOG|_logger|_log|self\.logger|self\.log|loguru\.logger|structlog|console|rich\.print)$
      - pattern: sys.stdout.write(...)
      - pattern: sys.stderr.write(...)
      - pattern: console.print(...)
      - pattern: rich.print(...)
      - pattern: st.write(...)
      - pattern: st.text(...)
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "LLM02:2025 Sensitive Information Disclosure"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, dotenv, logging, secrets, llm]
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
        - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
      masoon:
        pack: agentic-semgrep-rules
        family: secrets
